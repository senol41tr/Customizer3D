<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js v184 - Balanced Triangle Boundary Lens</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #050508;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Import Map for Three.js v184 and Lil-GUI -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        function initBalancedTriangleEngine() {
            const containerEl = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 2.5);

            const renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            containerEl.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            // ================================================================
            // 1. UNIFORMS VE SHADER MALZEMESİ
            // ================================================================
            const uniforms = {
                tMap: { value: null },
                uTime: { value: 0.0 },
                uBlurAmount: { value: 0.08 },                           // Blur Şiddeti
                uBoundaryType: { value: 0 },                            // 0: Circle, 1: Square, 2: Triangle
                uBoundaryCenter: { value: new THREE.Vector2(0.5, 0.5) },// Merkez Koordinatı
                uBoundarySize: { value: 0.25 },                         // Şekil Boyutu
                uFeather: { value: 0.05 },                              // Sınır Yumuşaklığı
                uInvertBlur: { value: true },                           // false: İçi Bulanık, true: Dışı Bulanık
                uShowRing: { value: true }                              // Sınır Çizgisi Gösterilsin mi?
            };

            const vertexShader = `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            // FRAGMENT SHADER (BALANCED TRIANGLE RADIUS / 2)
            const fragmentShader = `
                precision highp float;

                uniform float uTime;
                uniform float uBlurAmount;
                uniform int uBoundaryType;
                uniform vec2 uBoundaryCenter;
                uniform float uBoundarySize;
                uniform float uFeather;
                uniform bool uInvertBlur;
                uniform bool uShowRing;
                uniform sampler2D tMap;

                varying vec2 vUv;

                vec3 draw(sampler2D image, vec2 uv) {
                  return texture2D(image, vec2(uv.x, uv.y)).rgb;
                }

                float rand(vec2 co) {
                  return fract(sin(dot(co.xy, vec2(12.9898, 78.233))) * 43758.5453);
                }

                /*
                  DISK SAMPLING BLUR
                */
                vec3 blur(vec2 uv, sampler2D image, float blurAmount) {
                  vec3 blurredImage = vec3(0.);
                  float d = 1.0;
                  #define repeats 40.
                  for (float i = 0.; i < repeats; i++) { 
                    vec2 q = vec2(cos(degrees((i / repeats) * 360.)), sin(degrees((i / repeats) * 360.))) * (rand(vec2(i, uv.x + uv.y)) + blurAmount); 
                    vec2 uv2 = uv + (q * blurAmount * d);
                    blurredImage += draw(image, uv2) / 2.;
                    q = vec2(cos(degrees((i / repeats) * 360.)), sin(degrees((i / repeats) * 360.))) * (rand(vec2(i + 2., uv.x + uv.y + 24.)) + blurAmount); 
                    uv2 = uv + (q * blurAmount * d);
                    blurredImage += draw(image, uv2) / 2.;
                  }
                  return blurredImage / repeats;
                }

                // GEOMETRIC SIGNED DISTANCE FUNCTIONS (BALANCED SDF)
                float getBoundaryDistance(vec2 uv, vec2 center, int shapeType) {
                    vec2 p = uv - center;

                    if (shapeType == 0) {
                        // CIRCLE
                        return length(p);
                    } else if (shapeType == 1) {
                        // SQUARE
                        return max(abs(p.x), abs(p.y));
                    } else if (shapeType == 2) {
                        // EQUILATERAL TRIANGLE (Radius / 2 Kalibrasyonu)
                        vec2 pTri = p * 2.0; // CRITICAL STEP: Üçgen boyutunu 2 kat küçültüp eşitledik!
                        float k = sqrt(3.0);
                        pTri.x = abs(pTri.x) - 0.1;
                        pTri.y = pTri.y + 0.1;
                        if (pTri.x + k * pTri.y > 0.0) pTri = vec2(pTri.x - k * pTri.y, -k * pTri.x - pTri.y) / 2.0;
                        pTri.x -= clamp(pTri.x, -2.0, 0.0);
                        return max(-pTri.y, abs(pTri.x) * 0.866 + pTri.y * 0.5);
                    }
                    return length(p);
                }

                void main() {
                  vec2 uv = vUv;

                  // 1. NET VE BULANIK RESİM
                  vec3 netColor = texture2D(tMap, uv).rgb;
                  vec3 blurredColor = blur(uv, tMap, uBlurAmount);

                  // 2. GEOMETRİK DISTANCE HESABI
                  float dist = getBoundaryDistance(uv, uBoundaryCenter, uBoundaryType);
                  float blurMask = smoothstep(uBoundarySize + uFeather, uBoundarySize - uFeather, dist);

                  if (uInvertBlur) {
                    blurMask = 1.0 - blurMask;
                  }

                  // 3. RENK HARMANLAMA
                  vec3 finalColor = mix(netColor, blurredColor, blurMask);

                  // 4. INVERTED BORDER (SABİT TERS RENKLİ ÇİZGİ)
                  if (uShowRing) {
                    float ringWidth = 0.003;
                    float ringMask = smoothstep(ringWidth, 0.0, abs(dist - uBoundarySize));
                    vec3 invertedColor = 1.0 - finalColor;
                    finalColor = mix(finalColor, invertedColor, ringMask);
                  }

                  gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

            const shaderMaterial = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms,
                side: THREE.DoubleSide
            });

            const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), shaderMaterial);
            scene.add(planeMesh);

            // ================================================================
            // 2. DOKU YÜKLEME PIPELINE (EYE.JPG + FALLBACK)
            // ================================================================
            const textureLoader = new THREE.TextureLoader();

            function loadPhoto() {
                const imageUrl = 'eye.jpg';
                textureLoader.load(
                    imageUrl,
                    (tex) => {
                        tex.colorSpace = THREE.SRGBColorSpace;
                        uniforms.tMap.value = tex;
                        console.log('eye.jpg başarıyla yüklendi Boss!');
                    },
                    undefined,
                    () => {
                        console.warn('eye.jpg bulunamadı, varsayılan online fotoğraf yükleniyor...');
                        textureLoader.load(`https://picsum.photos/1024/1024?random=${Date.now()}`, (fallbackTex) => {
                            fallbackTex.colorSpace = THREE.SRGBColorSpace;
                            uniforms.tMap.value = fallbackTex;
                        });
                    }
                );
            }

            // ================================================================
            // 3. LIL-GUI KONTROL PANELİ
            // ================================================================
            const gui = new GUI({ title: ' Inverted Border Engine' });

            gui.add({ reload: loadPhoto }, 'reload').name(' Reload Image');

            const boundaryFolder = gui.addFolder('Boundary Shape & Size');
            boundaryFolder.add(
                uniforms.uBoundaryType,
                'value',
                {
                    'Circle (Daire)': 0,
                    'Square (Kare)': 1,
                    'Triangle (Üçgen)': 2
                }
            ).name(' Boundary Shape');

            boundaryFolder.add(uniforms.uBoundarySize, 'value', 0.02, 0.8, 0.01).name(' Boundary Size');
            boundaryFolder.add(uniforms.uBoundaryCenter.value, 'x', 0.0, 1.0, 0.01).name(' Center Position X');
            boundaryFolder.add(uniforms.uBoundaryCenter.value, 'y', 0.0, 1.0, 0.01).name(' Center Position Y');

            const blurFolder = gui.addFolder('Blur & Feather Settings');
            blurFolder.add(uniforms.uBlurAmount, 'value', 0.0, 0.25, 0.005).name(' Blur Amount');
            blurFolder.add(uniforms.uFeather, 'value', 0.001, 0.2, 0.005).name(' Edge Feather');
            blurFolder.add(uniforms.uInvertBlur, 'value').name(' Invert Blur Zone');

            const ringFolder = gui.addFolder('Inverted Boundary Ring');
            ringFolder.add(uniforms.uShowRing, 'value').name(' Show Inverted Ring');

            loadPhoto();

            // ================================================================
            // 4. RENDER DÖNGÜSÜ
            // ================================================================
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                uniforms.uTime.value = clock.getElapsedTime();
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        initBalancedTriangleEngine();
    </script>
</body>
</html>
