<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js v184 - TreeMap Masked Pixel Distortion</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #ebebeb;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
        }
    </style>

    <!-- Import Map for Three.js v184 and Lil-GUI -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.184.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.184.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/lil-gui.module.min.js';

        function initTreeMapEngine() {
            const containerEl = document.getElementById('canvas-container');
            const scene = new THREE.Scene();

            const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 2.5);

            const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(2);
            containerEl.appendChild(renderer.domElement);

            const controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const textureLoader = new THREE.TextureLoader();

            function loadRandomPhoto() {
                const imageUrl = 'face.jpg';
                textureLoader.load(imageUrl, (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    uniforms.uTexture.value = tex;
                });
            }

            const uniforms = {
                uTexture: { value: null },
                uTime: { value: 0.0 },
                uSplitCount: { value: 4.0 },
                uDistortionStrength: { value: 0.12 }
            };

            const vertexShader = `
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            const fragmentShader = `
                uniform sampler2D uTexture;
                uniform float uTime;
                uniform float uSplitCount;
                uniform float uDistortionStrength;

                varying vec2 vUv;

                float hash21(vec2 p) {
                    p = fract(p * vec2(123.34, 456.21));
                    p += dot(p, p + 45.32);
                    return fract(p.x * p.y);
                }

                vec4 calculateTreeMap(vec2 uv, float splits) {
                    vec2 st = uv;
                    vec2 cellId = vec2(0.0);
                    vec2 localUv = st;

                    for (float i = 0.0; i < 8.0; i++) {
                        if (i >= splits) break;

                        float randSplit = 0.3 + hash21(cellId + vec2(i, 1.3)) * 0.4;

                        if (mod(i, 2.0) == 0.0) {
                            if (localUv.x < randSplit) {
                                localUv.x = localUv.x / randSplit;
                                cellId.x = cellId.x * 2.0 + 0.0;
                            } else {
                                localUv.x = (localUv.x - randSplit) / (1.0 - randSplit);
                                cellId.x = cellId.x * 2.0 + 1.0;
                            }
                        } else {
                            if (localUv.y < randSplit) {
                                localUv.y = localUv.y / randSplit;
                                cellId.y = cellId.y * 2.0 + 0.0;
                            } else {
                                localUv.y = (localUv.y - randSplit) / (1.0 - randSplit);
                                cellId.y = cellId.y * 2.0 + 1.0;
                            }
                        }
                    }

                    return vec4(localUv, cellId);
                }

                void main() {
                    vec2 uv = vUv;

                    vec4 treeMapRes = calculateTreeMap(uv, uSplitCount);
                    vec2 localUv = treeMapRes.xy;
                    vec2 cellId = treeMapRes.zw;

                    float cellRandom = hash21(cellId);
                    float timeFactor = uTime + cellRandom * 6.28;
                    
                    float dynamicPixels = 1024.0 + cellRandom;
                    vec2 pixelatedUv = floor(uv * dynamicPixels) / dynamicPixels;

                    vec2 waveOffset = vec2(
                        sin(timeFactor + uv.y * 8.0),
                        cos(timeFactor + uv.x * 8.0)
                    ) * uDistortionStrength * (0.3 + cellRandom * 0.7);

                    vec2 displacedUv = pixelatedUv + waveOffset;
                    displacedUv = clamp(displacedUv, 0.0, 1.0);

                    vec3 finalColor = texture2D(uTexture, displacedUv).rgb;

                    gl_FragColor = vec4(finalColor, 1.0);
                }
            `;

            const shaderMaterial = new THREE.ShaderMaterial({
                vertexShader,
                fragmentShader,
                uniforms,
                transparent: true,
                depthTest:false,
                depthWrite: false,
                side: THREE.DoubleSide
            });

            const planeMesh = new THREE.Mesh(new THREE.PlaneGeometry(2.0, 2.0), shaderMaterial);
            scene.add(planeMesh);

            const gui = new GUI({ title: ' TreeMap Distortion Engine' });

            gui.add(uniforms.uSplitCount, 'value', 1.0, 8.0, 1.0).name(' Split Depth');
            gui.add(uniforms.uTime, 'value', 0.0, 10.0, 0.01).name(' Wave');
            gui.add(uniforms.uDistortionStrength, 'value', 0.0, 0.5, 0.01).name(' Distortion');

            loadRandomPhoto();

            function animate() {
                requestAnimationFrame(animate);
                controls.update();
                renderer.render(scene, camera);
            }

            animate();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        initTreeMapEngine();
    </script>
</body>
</html>
